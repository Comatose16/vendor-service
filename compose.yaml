services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: fts-jaeger-local
    ports:
      - "16686:16686" # Web UI
      - "4318:4318"   # OTLP HTTP receivr
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: fts-postgres-local
    environment:
      POSTGRES_DB: fts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fts"]
      interval: 5s
      timeout: 5s
      retries: 5

  venue-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fts-venue-service-local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fts
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
volumes:
  postgres_local_data:
