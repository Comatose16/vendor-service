spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fts}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/devdata
management:
  otlp:
    metrics:
      export:
        enabled: false
  logs:
    export:
      enabled: false
  opentelemetry:
    resource-attributes:
      "service.name": venue-service-local
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0