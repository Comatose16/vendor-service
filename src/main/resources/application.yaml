spring:
  application:
    name: venue-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fts}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # FLYWAY CONFIGURATION
  flyway:
    enabled: true
    baseline-on-migrate: true # Re-baselines if you have an existing DB state
    locations: classpath:db/migration

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics, prometheus
    endpoint:
      health:
        show-details: always
        probes:
          enabled: true
    metrics:
      tags:
        application: venue-service
      distribution:
        percentiles-histogram:
          http.server.requests: true
    tracing:
      sampling:
        probability: 1.0 # Trace 100% of requests (lower in production, e.g., 0.1)
      otlp:
        tracing:
          endpoint: http://localhost:4318/v1/traces # OTLP HTTP receiver (e.g., Jaeger)

    logging:
      pattern:
        # Includes [appname, traceId, spanId] automatically in console logs
        level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"