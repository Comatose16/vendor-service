spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fts_sandbox}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/devdata # Automatic test seeding

management:
  tracing:
    sampling:
      probability: 1.0 # Trace everything for debugging
  opentelemetry:
    resource-attributes:
      "service.name": venue-service-sandbox
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}