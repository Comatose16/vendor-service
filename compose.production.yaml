services:
  venue-service:
    image: ${ECR_REGISTRY}/fts-venue-service:${IMAGE_TAG}
    container_name: fts-venue-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${ENV_PROFILE} # 'stage' or 'prod'
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # OpenTelemetry Collector (Receives OTLP traces & routes metrics)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: fts-otel-collector
    restart: always
    ports:
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter endpoint

  # Prometheus (Scrapes Actuator & OTel metrics for Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: fts-prometheus
    restart: always
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # Grafana Dashboard (Stage & Prod only)
  grafana:
    image: grafana/grafana:latest
    container_name: fts-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data: